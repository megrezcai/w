name: Windows installer
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:win -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - run: npm run dist:win:zip -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: Xingban-Windows-x64
          path: |
            release/*.exe
            release/*-win.zip
          if-no-files-found: error
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $assets = @(Get-ChildItem release -File | Where-Object { $_.Extension -eq '.exe' -or $_.Name -like '*-win.zip' } | ForEach-Object { $_.FullName })
          if ($assets.Count -lt 2) { throw 'Missing installer or portable ZIP' }
          gh release create $env:RELEASE_TAG @assets --title "星伴 $env:RELEASE_TAG" --notes "Windows x64 初版。下载 Setup.exe 安装，或解压 win.zip 后启动星伴.exe。在角色与连接中填写兼容 OpenAI 的 API 地址、模型和密钥。当前程序未签名，尚无 Windows 实机验收。"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
